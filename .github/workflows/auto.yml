name: CI/CD Pipeline

on:
  push

jobs:
  tst-exe:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ secrets.USERNAME }}
      DB_PASSWORD: ${{ secrets.MDP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check env variables
        run: |
          echo $DB_URL
          echo $DB_USERNAME
          echo $DB_PASSWORD

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package

      - name: Run Docker containers
        run: docker compose up -d
        env:
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ secrets.USERNAME }}
          DB_PASSWORD: ${{ secrets.MDP }}
        
      - name: Show MySQL logs
        if: failure()             # ne s'exécute que si un step précédent a échoué
        run: |
          docker logs demo-mysql;
          exit 1
      - name: Follow Spring Boot logs
        if: always()
        run: docker logs demo-app --follow

      - name: Verify application is running
        run: |
          echo "⏳ Attente du démarrage de l'application…"

          for i in {1..30}; do
            if curl -s http://localhost:2005/actuator/health > /dev/null; then
              echo "✅ Application démarrée !"
              exit 0
            fi
            echo "Attente… ($i/30)"
            sleep 2
          done
          
          echo "❌ L'application n'a pas démarré après 60 secondes."
          curl http://localhost:2005 || true
          exit 1
          
      # - name: Show App logs
      #   if: failure()             # ne s'exécute que si un step précédent a échoué
      #   run: |
      #     echo "=== SPRING BOOT LOGS ==="
      #     docker logs demo-app > spring_logs.txt
      #     cat spring_logs.txt
      #     exit 1
          
      - name: Stop Docker containers
        if: always()
        run: docker compose down

  build-demo:
    runs-on: ubuntu-latest
    needs: tst-exe

    env:
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ secrets.USERNAME }}
      DB_PASSWORD: ${{ secrets.MDP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push Docker image
        with:
          image: kirito140/test_myapp
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-db:
    runs-on: ubuntu-latest
    needs: tst-exe
    env:
      DB_URL: ${{ vars.DB_URL }}
      DB_USERNAME: ${{ secrets.USERNAME }}
      DB_PASSWORD: ${{ secrets.MDP }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package

      - name: Run Docker containers
        run: docker build -t demo-mysql -f dockerfile-mysql.dockerfile .

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push Docker image
        with:
          image: kirito140/test_mysql
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
