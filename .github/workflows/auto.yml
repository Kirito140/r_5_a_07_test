name: CI/CD Pipeline

on: push

jobs:
  tst-exe:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package

      - name: Run Docker containers (tests)
        run: docker compose up -d
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Show MySQL logs if fail
        if: failure()
        run: |
          docker logs demo-mysql || true
          exit 1

      - name: Verify application is running
        run: |
          echo "⏳ Attente du démarrage de l'application..."
          sleep 30
          echo "🔍 Vérification sur http://localhost:2005"
          if ! curl -f http://localhost:2005; then
            echo "❌ L'application n'a pas démarré correctement. Logs :"
            docker compose logs
            exit 1
          fi

      - name: Stop Docker containers
        if: always()
        run: docker compose down

  build-db:
    runs-on: ubuntu-latest
    needs: tst-exe

    env:
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push DB Docker image
        with:
          image: kirito140/test_mysql
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-demo:
    runs-on: ubuntu-latest
    needs: build-db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push App Docker image
        with:
          image: kirito140/test_myapp
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile # ou Dockerfile selon ton repo
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
