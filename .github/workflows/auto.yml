name: CI/CD Pipeline

on: push

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Run Unit Tests (H2)
        run: mvn clean test -Ptest

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.DB_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Run Docker containers
        run: docker compose up -d

      - name: Show MySQL logs (on failure)
        if: failure()
        run: docker logs demo-mysql || true

      - name: Verify application is running
        run: |
          echo "⏳ Attente du démarrage de l'application..."
          sleep 30
          echo "🔍 Vérification sur http://localhost:2005"
          if ! curl -f http://localhost:2005; then
            echo "❌ L'application n'a pas démarré correctement. Logs :"
            docker compose logs
            exit 1
          fi

      - name: Stop Docker containers
        if: always()
        run: docker compose down

  build-app:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package -DskipTests

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push App image
        with:
          image: kirito140/test_myapp
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-db:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & push DB image
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: kirito140/demo-mysql
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
