name: CI/CD Pipeline

on:
  push

jobs:
  tst-exe:
    runs-on: ubuntu-latest
    env:
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build JAR
        run: mvn install
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: demo

      - name: Run Docker containers (tests)
        run: docker compose up -d
        
      - name: Show MySQL logs
        if: failure()             # ne s'exécute que si un step précédent a échoué
        run: |
          docker logs demo-mysql;
           exit 1

      - name: Verify application is running
        run: |
          echo "⏳ Attente du démarrage de l'application…"

          for i in {1..10}; do
            if curl -s http://localhost:2005/actuator/health > /dev/null; then
              echo "✅ Application démarrée !"
              exit 0
            fi
            echo "Attente… ($i/10)"
            docker ps -a
            docker inspect --format='{{.State.Running}}' demo-app | grep true >/dev/null || docker restart demo-app
            sleep 2
          done
          
          echo "❌ L'application n'a pas démarré après 20 secondes."
          curl http://localhost:2005 || true
          exit 1
          
      - name: Show App logs
        if: failure()             # ne s'exécute que si un step précédent a échoué
        run: |
           echo "=== SPRING BOOT LOGS ==="
           docker logs demo-app > spring_logs.txt
           cat spring_logs.txt
           docker logs --tail 50 demo-app
           exit 1
          
      - name: Stop Docker containers
        if: always()
        run: docker compose down

  build-db:
    runs-on: ubuntu-latest
    needs: tst-exe
    env:
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push DB Docker image
        with:
          image: mrcotin/test-db
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  build-demo:
    runs-on: ubuntu-latest
    needs: tst-exe
    env:
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn clean package

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push App Docker image
        with:
          image: mrcotin/test
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile # ou Dockerfile selon ton repo
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
