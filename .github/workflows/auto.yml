name: CI/CD Pipeline

on:
  push:
    branches:
      - master
jobs:
  # 1. Tests d’exécution (CI)
  test-app:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn -B clean package

      - name: Run Docker containers
        run: docker compose -f docker-compose.yml up -d
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Wait for app to be healthy
        run: |
          echo "⏳ Attente du démarrage de l'application..."
          for i in {1..10}; do
            if curl -fs http://localhost:2005/actuator/health; then
              echo "✅ Application OK"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Timeout: l'application n'a pas démarré."
          docker compose logs
          exit 1

      - name: Stop Docker containers
        if: always()
        run: docker compose -f docker-compose.yml down

  # 2. Build & Push image de l'application (CD)
  build-app:
    runs-on: ubuntu-latest
    needs: test-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push App Docker image
        with:
          image: kirito140/test_myapp
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  # 3. Build & Push image MySQL custom (CD)
  build-db:
    runs-on: ubuntu-latest
    needs: test-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push MySQL Docker image
        with:
          image: kirito140/demo-mysql
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
