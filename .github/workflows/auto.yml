name: CI/CD Pipeline

on:
  push:
    branches:
      - test_auto.yml

jobs:
  # 1. Tests unitaires avec H2 (rapides)
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Run unit tests (H2)
        run: mvn -B test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD:

  # 2. Tests d’intégration avec Docker (MySQL + App)
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      DB_URL: jdbc:mysql://db:3306/demo
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "24"

      - name: Build JAR
        run: mvn -B clean package -DskipTests

      - name: Run Docker containers
        run: docker compose -f docker-compose.yml up -d
        env:
          DB_URL: ${{ env.DB_URL }}
          DB_USERNAME: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}

      - name: Wait for app to be healthy
        run: |
          echo "⏳ Attente du démarrage de l'application..."
          for i in {1..10}; do
            if curl -fs http://localhost:2005/actuator/health; then
              echo "✅ Application OK"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Timeout: l'application n'a pas démarré."
          docker compose logs
          exit 1

      - name: Stop Docker containers
        if: always()
        run: docker compose -f docker-compose.yml down

  # 3. Build & Push image App
  build-app:
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push App Docker image
        with:
          image: kirito140/test_myapp
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  # 4. Build & Push image MySQL custom
  build-db:
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push MySQL Docker image
        with:
          image: kirito140/demo-mysql
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
