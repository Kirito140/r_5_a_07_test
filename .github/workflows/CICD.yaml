name: CI/CD Pipeline

on:
  push:
    branches:
      ["Tests-coco"]

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build JAR
        run: mvn install
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: demo

      - name: Run Docker containers (tests)
        run: docker compose up -d
        
      - name: Show MySQL logs
        if: failure()             # ne s'exécute que si un step précédent a échoué
        run: |
          docker logs demo-mysql;
           exit 1

      - name: Verify application is running
        run: |
          echo "⏳ Attente du démarrage de l'application…"

          for i in {1..10}; do
            if curl -s http://localhost:2005/actuator/health > /dev/null; then
              echo "✅ Application démarrée !"
              exit 0
            fi
            echo "Attente… ($i/10)"
            docker ps -a
            docker inspect --format='{{.State.Running}}' demo-app | grep true >/dev/null || docker restart demo-app
            sleep 2
          done
          
          echo "❌ L'application n'a pas démarré après 20 secondes."
          curl http://localhost:2005 || true
          exit 1
          
      - name: Show App logs
        if: failure()             # ne s'exécute que si un step précédent a échoué
        run: |
           echo "=== SPRING BOOT LOGS ==="
           docker logs demo-app > spring_logs.txt
           cat spring_logs.txt
           docker logs --tail 50 demo-app
           exit 1

      - name: Print images (temp)
        run: docker images

      - name: Save app image
        run: docker save -o app.tar demo-app:latest

      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: image-app
          path: app.tar

      - name: Save db image
        run: docker save -o db.tar demo-bd:latest

      - name: Upload db image
        uses: actions/upload-artifact@v4
        with:
          name: image-db
          path: db.tar

      - name: Stop Docker containers
        if: always()
        run: docker compose down

  Push-db:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: mr-smithers-excellent/docker-build-push@v6
        name: Build & push DB Docker image
        with:
          image: mrcotin/test-db
          tags: v1, latest
          registry: docker.io
          dockerfile: dockerfile-mysql.dockerfile
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  Push-app:
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Récupération de l'image depuis le cache
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-app
          path: .

      # Taguer l'image existante
      - name: Tag the existing image
        run: |
          docker tag your-prebuilt-image:latest registry.example.com/myrepo/image:tag

      # Se connecter a Docker-Hub
      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Push l’image taguée
      - name: Push image
        run: |
          docker push registry.example.com/myrepo/image:tag
