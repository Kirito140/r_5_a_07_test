services:
  app:
    image: mrcotin/test:v2
    container_name: demo-app
    ports:
      - "${APP_PORT:-2005}:2005"
    volumes:
      - ./src/main/resources/application.yml:/app/application.yml:ro
    depends_on:
      - db
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-demo}
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-pasword}

  db:
    image: mrcotin/test-db:latest
    container_name: demo-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-demo}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pasword}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-pasword}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      [3306:3306]

volumes:
   db_data: